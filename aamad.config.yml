# AAMAD project configuration for ARLO.
# Copied from aamad.config.example.yml; runtime set by operator 2026-08-31.
# Prefer AAMAD_TARGET_RUNTIME env over runtime.target when both are set.

version: 1

runtime:
  target: claude-agent-sdk

language:
  primary: python
  secondary: []

libraries:
  approved:
    - claude-agent-sdk
  forbidden: []

ui:
  theme: system
  visual_style: minimal
  prefer_modals: false

coding_standards:
  style_guide: ""
  type_checking: true
  max_file_lines: 400

security:
  require_security_assessment: true
  forbid_committed_secrets: true
  dependency_audit: true

documentation:
  require_user_guide: true
  sync_docs_after_code_changes: true

testing:
  require_unit_tests: true
  require_integration_tests: true
  map_to_acceptance_criteria: true
